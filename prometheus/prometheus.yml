global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # n8n main and workers. The file is written by scripts/generate_n8n_workers.sh only
  # while the n8n profile is active, and sets the job label per target group (n8n /
  # n8n-worker). Picked up without a restart: file watch plus the 5m default refresh_interval
  - job_name: "n8n"
    file_sd_configs:
      - files: ["/etc/prometheus/targets/n8n.json"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
