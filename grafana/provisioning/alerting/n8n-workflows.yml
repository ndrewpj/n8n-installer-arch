# Grafana-managed alert rules for n8n workflow executions.
# Provisioned rules are read-only in the UI: tune thresholds here and run `make restart`.
#
# Delivery: alerts follow Grafana's default notification policy, which points at the
# built-in "grafana-default-email" contact point. This stack configures no SMTP, so that
# contact point delivers nothing until GF_SMTP_* is set. Create a contact point (Telegram,
# Slack, ...) in Alerting > Contact points and make it the default policy's receiver in
# Alerting > Notification policies.
#
# noDataState is OK on purpose: the workflow metrics do not exist until the first
# execution, and Grafana's default NoData state would send DatasourceNoData
# notifications on every fresh install. Loss of the metrics altogether is covered by
# the "n8n metrics target down" rule.
#
# The 24h thresholds are global. Workflows that legitimately run less than daily
# (weekly schedules, error handlers) will alert; raise the threshold or pause the rule.
#
# Manual runs from the editor are excluded everywhere via mode!="manual". Failures that
# n8n main handles itself (worker crash, enqueue error) never reach the execution
# metrics and are not counted; the target-down rule covers a dead worker.
apiVersion: 1

groups:
  - orgId: 1
    name: n8n-workflows
    folder: n8n
    interval: 1m
    rules:
      - uid: n8n-workflow-failed
        title: n8n workflow failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: Prometheus
              # Failed (or cancelled) non-manual executions per workflow in the last 15
              # minutes. The name is joined from n8n_workflow_info; when that gauge is
              # missing the alert still fires, without a name
              expr: >-
                sum by (workflow_id) (increase(n8n_workflow_execution_duration_seconds_count{status="failed", mode!="manual"}[15m]))
                * on (workflow_id) group_left (workflow_name) n8n_workflow_info
                or (sum by (workflow_id) (increase(n8n_workflow_execution_duration_seconds_count{status="failed", mode!="manual"}[15m]))
                unless on (workflow_id) n8n_workflow_info)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Workflow "{{ or $labels.workflow_name $labels.workflow_id }}" failed'
          description: 'Workflow "{{ or $labels.workflow_name $labels.workflow_id }}" (id {{ $labels.workflow_id }}) had {{ printf "%.0f" $values.B.Value }} failed or cancelled execution(s) in the last 15 minutes (manual runs excluded).'
        labels:
          severity: warning
          service: n8n
        isPaused: false

      - uid: n8n-workflow-stalled
        title: n8n workflow stalled
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: Prometheus
              # Seconds since the last non-manual success, for active workflows only.
              # n8n:workflow_last_success_timestamp_seconds is a Prometheus recording rule
              # (prometheus/rules/n8n-workflows.yml) that remembers the last success for
              # 30 days, up to 5 minutes late
              expr: >-
                (time() - n8n:workflow_last_success_timestamp_seconds)
                * on (workflow_id) group_left (workflow_name) n8n_active_workflow_info
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    # 24 hours without a successful execution
                    params: [86400]
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'Workflow "{{ $labels.workflow_name }}" has not run successfully for 24h'
          description: 'Active workflow "{{ $labels.workflow_name }}" (id {{ $labels.workflow_id }}) last succeeded {{ humanizeDuration $values.B.Value }} ago (manual runs excluded).'
        labels:
          severity: warning
          service: n8n
        isPaused: false

      - uid: n8n-workflow-no-success
        title: n8n workflow has no recorded success
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: Prometheus
              # Active workflows with no non-manual success in the recording rule at all:
              # already broken when monitoring was installed, or never succeeded since
              expr: n8n_active_workflow_info unless on (workflow_id) n8n:workflow_last_success_timestamp_seconds
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 24h
        annotations:
          summary: 'Workflow "{{ $labels.workflow_name }}" has no recorded success'
          description: 'Active workflow "{{ $labels.workflow_name }}" (id {{ $labels.workflow_id }}) has been active for 24 hours without a single non-manual success recorded since monitoring started (history covers 30 days). Either it is broken, or it runs less than daily.'
        labels:
          severity: warning
          service: n8n
        isPaused: false

      - uid: n8n-metrics-target-down
        title: n8n metrics target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: Prometheus
              # Any n8n main or worker target that Prometheus cannot scrape. All n8n targets
              # come from a file that is removed when the n8n profile is off, so no data
              # then simply means nothing to scrape
              expr: up{job=~"n8n|n8n-worker"} == 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'n8n metrics target {{ $labels.instance }} is down'
          description: 'Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }}) for 5 minutes. Workflow panels and alerts are blind while this lasts. Check the container with `make status` and `make logs`.'
        labels:
          severity: critical
          service: n8n
        isPaused: false
